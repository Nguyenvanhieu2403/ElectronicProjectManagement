<p-dialog #dialog header="Thêm mới đợt đồ án" [(visible)]="isShow" [modal]="true"
  [styleClass]="'ag-modal force-full-width'" [style]="{'width': '1200px'}" closeIcon="ci ci-close"
  maximizeIcon="ci ci-maximize" minimizeIcon="ci ci-minimize" [maximizable]="true" [autoZIndex]="true">
  <div class="col-12 md:col-12">
    <form #formElement [formGroup]="formGroup">
      <div>
        <validation-summary #validationSummary [formElement]="formElement" [formGroup]="formGroup">
        </validation-summary>
      </div>

      <div class="col-12 md:col-12 p-fluid p-formgrid grid">
        <div class="field col-12 md:col-6">
          <label for="name">Tên đợt bảo vệ <span style="color: red;">*</span></label>
          <input type="text" pInputText [(ngModel)]="itemDetail.name" autocomplete="off"
            formControlName="name">
        </div>
        <div class="field col-12 md:col-6">
          <label for="location">Phòng bảo vệ <span style="color: red;">*</span></label>
          <input type="text" pInputText [(ngModel)]="itemDetail.location" autocomplete="off"
            formControlName="location">
        </div>
        <div class="field col-12 md:col-6">
          <label for="beginDate">Ngày bắt đầu <span style="color: red;">*</span></label>
          <!-- <p-calendar appendTo="body" [(ngModel)]="itemDetail.beginDate" formControlName="beginDate" dateFormat="dd/mm/yy" [minDate]="currentDate" /> -->
          <p-calendar appendTo="body" inputId="calendar-24h" [(ngModel)]="itemDetail.beginDate" [showTime]="true" [hourFormat]="24" formControlName="beginDate" dateFormat="dd/mm/yy" [minDate]="currentDate" />
        </div>
        <div class="field col-12 md:col-6">
          <label for="endDate">Ngày kết thúc <span style="color: red;">*</span></label>
          <!-- <p-calendar appendTo="body" [(ngModel)]="itemDetail.endDate" formControlName="endDate" dateFormat="dd/mm/yy" [minDate]="itemDetail.beginDate" /> -->
          <p-calendar appendTo="body" inputId="calendar-24h" [(ngModel)]="itemDetail.endDate" [showTime]="true" [hourFormat]="24" formControlName="endDate" dateFormat="dd/mm/yy" [minDate]="itemDetail.beginDate" />
        </div>
        <div class="field col-12 md:col-6">
          <label for="idTeacher">Giảng viên tham gia<span style="color: red;">*</span></label>
          <p-multiSelect [options]="listTeacher" dropdownIcon="ci ci-chevron-down-1"
            appendTo="body" [(ngModel)]="itemDetail.idTeacher" formControlName="idTeacher" [filter]="true" filterBy="label,value">
          </p-multiSelect>
        </div>
        <div class="field col-12 md:col-6">
          <label for="idPersonalProjectManagement">Đồ án bảo vệ<span style="color: red;">*</span></label>
          <p-multiSelect [options]="listProjetcs" dropdownIcon="ci ci-chevron-down-1"
            appendTo="body" [(ngModel)]="itemDetail.idPersonalProjectManagement" formControlName="idPersonalProjectManagement" [filter]="true" filterBy="label,value">
          </p-multiSelect>
        </div>
      </div>
    </form>
  </div>
  <p-footer>
    <div class="col-12 md:col-12">
      <div class="col-8 md:col-8 fl h-text-left">
      </div>
      <div class="col-4 md:col-4 fr">
        <button pButton pRipple type="button" label="{{'BUTTON.SAVE_CLOSE' | translate}}" icon="pi pi-save"
          [disabled]="submitting" class="p-button mr-2 mb-2" (click)="saveAndClose()"></button>
<!-- 
        <button pButton pRipple type="button" label="{{'BUTTON.SAVE_CONTINUE' | translate}}" icon="pi pi-save"
          [disabled]="submitting" class="p-button mr-2 mb-2" (click)="save()"></button> -->
      </div>
    </div>
  </p-footer>
</p-dialog>
